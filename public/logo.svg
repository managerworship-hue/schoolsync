<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo Obsidian -->
  <rect width="512" height="512" rx="112" fill="#0b0f19" />
  
  <!-- Borda com Brilho Gradiente -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.4" />
  
  <!-- Ícone Central: Livro Aberto com Relógio de Foco Stylized -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Livro -->
    <path d="M60 40c-25 0-50 8-60 20v200c10-12 35-20 60-20h96V40H60z" fill="url(#grad)" opacity="0.85" />
    <path d="M252 40c-25 0-50 8-60 20v200c10-12 35-20 60-20h60V40h-60z" fill="url(#grad)" />
    
    <!-- Linhas das Páginas -->
    <line x1="30" y1="80" x2="120" y2="80" stroke="#0b0f19" stroke-width="6" stroke-linecap="round" />
    <line x1="30" y1="120" x2="120" y2="120" stroke="#0b0f19" stroke-width="6" stroke-linecap="round" />
    <line x1="30" y1="160" x2="90" y2="160" stroke="#0b0f19" stroke-width="6" stroke-linecap="round" />
    
    <line x1="222" y1="80" x2="282" y2="80" stroke="#0b0f19" stroke-width="6" stroke-linecap="round" />
    <line x1="192" y1="120" x2="282" y2="120" stroke="#0b0f19" stroke-width="6" stroke-linecap="round" />
    <line x1="192" y1="160" x2="282" y2="160" stroke="#0b0f19" stroke-width="6" stroke-linecap="round" />
    
    <!-- Relógio de Foco no centro superior -->
    <circle cx="156" cy="40" r="32" fill="#0b0f19" stroke="url(#grad)" stroke-width="6" />
    <polyline points="156,22 156,40 168,40" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
